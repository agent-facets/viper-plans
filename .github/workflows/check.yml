name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install the facet CLI
        run: curl -fsSL https://agentfacets.io/install | bash -s -- --version 0.33.0

      - run: bun install --frozen-lockfile

      - name: Format, types, versions, build, tests, package, and facet
        run: bun check
