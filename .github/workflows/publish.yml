name: Publish

on:
  release:
    types: [published]
  # Recovery path: a release whose publish failed can be retried without
  # recreating the release or moving its tag.
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish
        required: true
        type: string

permissions:
  contents: read
  # Trusted publishing: npm authenticates this workflow through OIDC, and
  # generates the provenance attestation from the same token.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Use an npm that supports trusted publishing
        run: npm install --global npm@11.11.0

      - name: Install the facet CLI
        run: curl -fsSL https://agentfacets.io/install | bash -s -- --version 0.33.0

      - run: bun install --frozen-lockfile

      - name: Require the release tag to match the package version
        run: bun run scripts/check-version.ts --tag "${RELEASE_TAG}"

      - name: Format, types, versions, build, tests, package, and facet
        run: bun check

      - name: Pack and inspect the release tarball
        id: pack
        run: |
          set -euo pipefail
          mkdir -p release
          npm pack --pack-destination release
          # An absolute path: npm reads a bare "release/<file>.tgz" as GitHub
          # shorthand rather than as a local tarball.
          tarball="$(realpath "$(ls release/*.tgz)")"
          echo "Contents of ${tarball}:"
          tar -tzf "${tarball}"
          echo "tarball=${tarball}" >> "$GITHUB_OUTPUT"

      - name: Publish the inspected tarball
        run: npm publish "${{ steps.pack.outputs.tarball }}"
