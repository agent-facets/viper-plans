name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read
  # Trusted publishing: npm authenticates this workflow through OIDC, and
  # generates the provenance attestation from the same token.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Use an npm that supports trusted publishing
        run: npm install --global npm@11.11.0

      - name: Install the facet CLI
        run: curl -fsSL https://agentfacets.io/install | bash -s -- --version 0.33.0

      - run: bun install --frozen-lockfile

      - name: Require the release tag to match the package version
        run: bun run scripts/check-version.ts --tag "${{ github.event.release.tag_name }}"

      - name: Format, types, versions, build, tests, package, and facet
        run: bun check

      - name: Pack and inspect the release tarball
        id: pack
        run: |
          set -euo pipefail
          mkdir -p release
          npm pack --pack-destination release
          tarball="$(ls release/*.tgz)"
          echo "Contents of ${tarball}:"
          tar -tzf "${tarball}"
          echo "tarball=${tarball}" >> "$GITHUB_OUTPUT"

      - name: Publish the inspected tarball
        run: npm publish "${{ steps.pack.outputs.tarball }}"
